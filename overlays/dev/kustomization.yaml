# kustomization.yaml — dev's overlay patching the `helm template` output
# (D-28/D-29, Pattern 3: helm template | kustomize build — never Kustomize's
# `--enable-helm` chart-inflator, never ArgoCD-side Helm rendering).
#
# `resources: [rendered-input.yaml]` is the render pipeline's transient
# intermediate — regenerated by every render (see this repo's .gitignore),
# never itself committed. The exact two-command sequence that produces it
# and then folds it through this overlay is recorded in
# argocd/bootstrap/bootstrap-argocd.sh's header comment; Plan 03-08
# automates it as a workflow. The committed output of THIS overlay is
# ../../envs/dev/media/all.yaml — that file, not this one, is what ArgoCD
# actually syncs.
#
# `namespace: dev` here (not baked into the chart's own templates) is
# deliberate: the chart stays environment-agnostic and reusable, and the
# per-env namespace assignment is exactly the kind of environment-specific
# concern Kustomize — not Helm — is the right layer for.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
  - rendered-input.yaml
