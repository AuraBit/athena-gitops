# kustomization.yaml — dev's MEDIA-unit overlay patching the `helm
# template` output (D-28/D-29, Pattern 3: helm template | kustomize build —
# never Kustomize's `--enable-helm` chart-inflator, never ArgoCD-side Helm
# rendering).
#
# One overlay directory per deployable unit, per env (Plan 03-04, Task 3):
# this directory renders ONLY the media-*.yaml templates via `helm
# template --show-only` — the chart now also carries datastores-*.yaml
# templates (and later shop-*.yaml), and a per-unit ArgoCD child
# Application needs a per-unit rendered file, so a single combined render
# would defeat that split. The sibling `overlays/dev/datastores/` directory
# is the datastores unit's own overlay, following the identical pattern.
#
# `resources: [rendered-input.yaml]` is the render pipeline's transient
# intermediate — regenerated by every render (see this repo's .gitignore),
# never itself committed. The exact two-command sequence that produces it
# and then folds it through this overlay is recorded in
# argocd/bootstrap/bootstrap-argocd.sh's header comment; Plan 03-08
# automates it as a workflow. The committed output of THIS overlay is
# ../../envs/dev/media/all.yaml — that file, not this one, is what ArgoCD
# actually syncs.
#
# Render command for this unit (run from the repo root, athena-gitops/):
#   helm template athena charts/athena \
#     -f charts/athena/values.yaml -f charts/athena/values-dev.yaml \
#     --show-only templates/media-deployment.yaml \
#     --show-only templates/media-service.yaml \
#     --show-only templates/media-httproute.yaml \
#     > overlays/dev/rendered-input.yaml
#   kustomize build overlays/dev > envs/dev/media/all.yaml
#
# `namespace: dev` here (not baked into the chart's own templates) is
# deliberate: the chart stays environment-agnostic and reusable, and the
# per-env namespace assignment is exactly the kind of environment-specific
# concern Kustomize — not Helm — is the right layer for.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
  - rendered-input.yaml

# The media image pin — the ENTIRE surface of the CI-to-CD handoff (D-22,
# Plan 03-08). CI's gitops-handoff job edits ONLY the newTag value below;
# promotion to stg/prod is copying this value into that environment's
# overlay, and rollback is reverting the commit that changed it. The tag is
# deliberately NOT in the chart's values files, where a chart change and an
# image change would collide in the same diff.
images:
  - name: athena-registry:5000/athena-media
    newTag: 2f2e650 # media image pin — CI-to-CD handoff surface (D-22)
