name: lint

# athena-gitops deliberately has no merge-queue trigger — D-02 restricts the
# merge queue to athena-app only. This repo stays queue-free because the
# bot's promotion-commit path (Phase 3+) must be fast, not gated behind a
# queue of other PRs.
on:
  push:
    branches: [main]
  pull_request:

# Org default is already read-only (actions-security.tf); this workflow
# states its own baseline explicitly too, per the shared security shape
# every workflow in this estate copies (D-08).
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout pinned to a full 40-character commit SHA, not a
      # mutable tag — the control against the tj-actions-style supply-chain
      # compromise, where a tag was repointed at malicious code after the
      # fact. A SHA is immutable; a tag is not.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: YAML syntax parse — everything under envs/
        run: |
          set -euo pipefail
          # Ruby's stdlib Psych YAML parser ships on every GitHub-hosted
          # ubuntu-latest runner — a real syntax check with zero extra
          # installs beyond what the image already provides.
          FILES="$(find envs -type f \( -name '*.yaml' -o -name '*.yml' \) 2>/dev/null || true)"
          if [ -z "${FILES}" ]; then
            echo "No YAML files under envs/ yet (folder-per-env skeleton only) — nothing to parse."
            exit 0
          fi
          printf '%s\n' "${FILES}" | xargs -n1 ruby -ryaml -e 'YAML.load_file(ARGV[0])' --
          echo "All envs/ YAML files parsed cleanly."
