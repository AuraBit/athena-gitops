# app-cluster-secret.yaml — declarative ArgoCD cluster registration for the
# app cluster (CD-01 hub-and-spoke; D-32; ArgoCD's own documented mechanism:
# a Secret labelled argocd.argoproj.io/secret-type: cluster in the argocd
# namespace).
#
# This is a TEMPLATE, applied only via bootstrap-argocd.sh's substitution —
# never applied directly. The three placeholders below are the app
# cluster's live, this-host-specific reachable server URL (Task 1's proven
# value), a ServiceAccount bearer token, and the app cluster's own CA
# certificate — all read from the live app cluster at bootstrap time,
# substituted in memory, and NEVER committed to git or echoed to script
# output or logs (T-03-01/T-03-04). This committed file always carries only
# these three placeholder tokens; if you ever see a real token or caData
# value in a `git diff` of this file, that is a secret-handling bug, not a
# cosmetic issue — stop and treat it as one.
apiVersion: v1
kind: Secret
metadata:
  name: app-cluster-secret
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
type: Opaque
stringData:
  name: app-cluster
  server: "__APP_CLUSTER_SERVER__"
  config: |
    {
      "bearerToken": "__APP_CLUSTER_TOKEN__",
      "tlsClientConfig": {
        "insecure": false,
        "caData": "__APP_CLUSTER_CA__"
      }
    }
