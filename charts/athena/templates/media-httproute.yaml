# media-httproute.yaml — attaches media-<env>.athena.net to the EXISTING
# `athena` Gateway in namespace `gateway` (estate/athena-infra/clusters/app/
# gateway.yaml, read verbatim this session) via parentRefs. Creates no new
# Certificate — the wildcard `*.athena.net` cert the Gateway already
# terminates covers this hostname too (D-03/D-20).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: media
spec:
  parentRefs:
    - name: athena
      namespace: gateway
  hostnames:
    - "{{ .Values.media.hostname }}"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: media
          port: {{ .Values.media.service.port }}
      matches:
        - path:
            type: PathPrefix
            value: /
