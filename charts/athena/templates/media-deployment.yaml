# media-deployment.yaml — the media service's Deployment (D-17).
#
# securityContext is not decorative: runAsNonRoot + readOnlyRootFilesystem +
# all capabilities dropped matches the distroless nonroot image itself
# (athena-app src/media/Dockerfile, D-10) — the pod spec and the image it
# runs make the same claim twice, so one drifting out of sync with the other
# is a visible contradiction, not a silent gap.
#
# Both probes hit /healthz — the only route this phase's media service
# exposes (T-03-05 mitigation: explicit resource requests/limits below,
# asserted by the rendered manifest per this plan's must_haves).
#
# MEDIA_DATABASE_URL (Plan 03-04) is sourced via secretKeyRef from the
# datastores unit's Secret (datastores-postgres.yaml) — never rendered in
# plain text in this Deployment. MEDIA_VALKEY_ADDR names the media-session
# Valkey Service explicitly (datastores.valkey.mediaSession.serviceName) —
# never the cart instance (D-18); grep -c 'cart' against the rendered
# output must stay 0.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media
  labels:
    app: media
spec:
  replicas: {{ .Values.media.replicaCount }}
  selector:
    matchLabels:
      app: media
  template:
    metadata:
      labels:
        app: media
    spec:
      securityContext:
        runAsNonRoot: true
        # 65532 is gcr.io/distroless's well-known nonroot UID (its own
        # nonroot image variants map the symbolic `nonroot` USER to this
        # numeric UID). Required, not decorative (Rule 1 — bug, found live):
        # the distroless static image ships no /etc/passwd at all, so
        # kubelet cannot resolve the image's symbolic `USER nonroot`
        # directive to a numeric UID to satisfy runAsNonRoot's admission
        # check on its own — without an explicit numeric runAsUser here,
        # the container fails to start with
        # "container has runAsNonRoot and image has non-numeric user
        # (nonroot), cannot verify user is non-root".
        runAsUser: 65532
      containers:
        - name: media
          image: "{{ .Values.media.image.repository }}:{{ .Values.media.image.tag }}"
          imagePullPolicy: {{ .Values.media.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.media.service.port }}
          env:
            - name: MEDIA_HTTP_PORT
              value: "{{ .Values.media.env.httpPort }}"
            - name: MEDIA_ENVIRONMENT
              value: "{{ .Values.media.env.environment }}"
            - name: MEDIA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: media-postgres-credentials
                  key: database-url
            - name: MEDIA_VALKEY_ADDR
              value: "{{ .Values.datastores.valkey.mediaSession.serviceName }}:6379"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: {{ .Values.media.resources.requests.cpu }}
              memory: {{ .Values.media.resources.requests.memory }}
            limits:
              cpu: {{ .Values.media.resources.limits.cpu }}
              memory: {{ .Values.media.resources.limits.memory }}
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
