# values.yaml — shared defaults for every deployable unit in the Athena
# chart (D-17). Structure is per-unit: `media:` and `datastores:` today;
# `shop:` (Plan 03-06) lands beside them as a sibling, never restructuring
# this top level (CONTEXT.md's assumption-delta "promote" decision — the
# media service and the future Boutique units are three instances of the
# same machinery, not one special-cased original plus bolt-ons).
#
# Values here are shared across every environment; values-<env>.yaml files
# carry ONLY what genuinely differs per env (image tag, hostname, the
# environment name itself) — never redeclare a value that doesn't change.
media:
  image:
    # In-cluster pull address (athena-registry:5000), deliberately distinct
    # from the host-side push address (localhost:5000) — same split Plan 01
    # already established for the registry generally.
    repository: athena-registry:5000/athena-media
    tag: "" # REQUIRED override per env — the immutable short-SHA tag (D-22)
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    port: 8080
  hostname: "" # REQUIRED override per env, e.g. media-dev.athena.net
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  env:
    httpPort: "8080" # matches service.port; kept separate since MEDIA_HTTP_PORT
    # is the container's own listen port, not necessarily always equal to
    # the Service's port in a future env
    environment: "" # REQUIRED override per env — dev/stg/prod, MEDIA_ENVIRONMENT
  # S3 settings (Plan 03-05, D-02, D-07): the bucket Terraform's data-storage
  # stack creates, addressed through the in-cluster host alias fixed in
  # Plan 03-01 — never the loopback address that only works from the host.
  s3:
    bucket: "" # REQUIRED override per env — Terraform's real media_bucket_name output
    # Shared across every env: every env's LocalStack instance lives at the
    # same host-level address (docker-compose binds 0.0.0.0:4566), so this
    # is not itself an env-specific value the way the bucket name is.
    endpoint: "http://host.k3d.internal:4566"
    region: us-east-1
    keyPrefix: "uploads/"
    maxUploadSizeBytes: "8388608" # 8 MiB — a small number of megabytes,
    # proportionate to a demo image service; exposed as configuration
    # (never a literal in the handler) so it can be driven down cheaply for
    # testing.
    # Simulated per-environment LocalStack credentials (D-16) — non-secret
    # by construction: they are LocalStack's account-namespacing mechanism
    # (which simulated account a request lands in), NOT an authorisation
    # credential. Plain values are acceptable ONLY because of that — this
    # exact pattern (a literal access key/secret in a values file) would be
    # actively wrong the moment these targeted a real AWS account; do not
    # copy it where that distinction doesn't hold. REQUIRED override per
    # env, matching scripts/tf-env.sh's per-env simulated account id.
    accessKeyId: ""
    secretAccessKey: ""

# datastores (Plan 03-04, D-32): Postgres for the media schema, and TWO
# separately-named Valkey instances — cart and media-session (D-18). Not
# one shared instance with two logical databases: separate-store-per-concern
# maps one-to-one onto Phase 6's two ElastiCache instances.
datastores:
  postgres:
    image:
      repository: postgres
      tag: "18"
      pullPolicy: IfNotPresent
    # local-path is k3d's default dynamic provisioner — the $0 local stand-in
    # for Phase 6's real EBS-backed RDS storage, not a production choice.
    storageClassName: local-path
    storageSize: 1Gi
    database: media
    username: media
    # Plain literal, not a Vault reference (T-03-23, accepted disposition):
    # Vault + External Secrets Operator is Phase 5's scope; this ordinary
    # Kubernetes Secret is the deliberate starting point that phase
    # demonstrably improves. Local-only, non-production credential.
    password: media-postgres-dev-only
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  valkey:
    image:
      repository: valkey/valkey
      tag: "8"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    cart:
      # CART CACHE-ADDRESS DECISION (RESEARCH.md Pitfall 4): upstream's
      # cartservice hard-codes REDIS_ADDR=redis-cart:6379 as a literal
      # Kubernetes Service DNS name in its own manifests, not a
      # Helm-templated value. This chart KEEPS that exact Service name
      # (option a — "replace in place") for the cart Valkey instance rather
      # than renaming it and overriding cartservice's env var. Plan 03-06
      # must not rename this Service.
      serviceName: redis-cart
    mediaSession:
      # The media service's own instance — never the cart instance (D-18).
      # Wired into media's MEDIA_VALKEY_ADDR below by this exact name; the
      # two are separately named Services so pointing media at the cart
      # instance is a visible configuration error, not a silent one.
      serviceName: media-valkey

# shop (Plan 03-06, D-17): the rebranded Boutique storefront, authored fresh
# in this chart from upstream's manifests read only as a reference spec
# (ports, env vars, inter-service dependencies) — never copied wholesale.
# `shop.services` is a map keyed by Kubernetes Service/Deployment name; the
# range in templates/shop-services.yaml iterates it in sorted-key order
# (same Sprig behaviour datastores-valkey.yaml's dict+range already
# relies on), so adding a service here adds a Deployment+Service with no
# template edit. frontend and loadgenerator are templated separately
# (shop-frontend.yaml, shop-loadgenerator.yaml) because each carries
# surface no other service does — the external route, and the
# enable/disable + concurrency knobs, respectively.
shop:
  image:
    # Each service's image is this repository plus "-<service-name>",
    # e.g. athena-registry:5000/athena-cartservice — the exact naming
    # scripts/build-all-images.sh already produces (D-16). One shared tag
    # for the whole storefront build: every vendored service is rebuilt
    # and retagged together, so there is exactly one "the storefront is
    # built from this commit" answer, not eleven independently-drifting
    # ones.
    repository: athena-registry:5000/athena
    tag: "" # REQUIRED override per env — the immutable short-SHA tag (D-22)
    pullPolicy: IfNotPresent
  hostname: "" # REQUIRED override per env, e.g. shop-dev.athena.net
  # Backend services: gRPC-only, no external route. Every one of the ten
  # services below implements the standard gRPC Health Checking Protocol
  # (grpc.health.v1.Health — verified this session by reading each
  # service's own source, not assumed), so every probe below is
  # Kubernetes' native `grpc:` probe (GA since k8s 1.27; this estate's k3s
  # is 1.35.5) — never an HTTP probe against a port that speaks gRPC, the
  # exact copy-paste mistake this plan's action text warns against.
  #
  # None of these vendored images declare a non-root USER except
  # cartservice's own (UID 1000, baked into its Dockerfile) — verified
  # live this session via `docker image inspect --format '{{.Config.User}}'`
  # against every built athena-<service> image. runAsUser: 1000 below is
  # this chart's own choice (D-17: the estate authors its own security
  # posture, not upstream's), applied uniformly and proven live in Task 3
  # rather than assumed; readOnlyRootFilesystem defaults true with an
  # `emptyDirTmp` escape hatch (mounts a writable /tmp) for any service a
  # live rollout proves needs one — set per-service below with a comment
  # naming the reason, never silently.
  services:
    cartservice:
      port: 7070
      replicas: 1
      env:
        # Upstream's own literal (RESEARCH.md Pitfall 4) — the cart
        # Valkey Service keeps the name `redis-cart` (Plan 03-04 Task 3)
        # specifically so this value needs no override mechanism, only a
        # restatement of the address that Service name already resolves.
        REDIS_ADDR: "redis-cart:6379"
      securityContext:
        runAsUser: 1000
        readOnlyRootFilesystem: true
      resources:
        requests: { cpu: 50m, memory: 96Mi }
        limits: { cpu: 200m, memory: 192Mi }
    productcatalogservice:
      port: 3550
      replicas: 1
      env:
        PORT: "3550"
      securityContext:
        runAsUser: 1000
        readOnlyRootFilesystem: true
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { cpu: 200m, memory: 128Mi }
    currencyservice:
      port: 7000
      replicas: 1
      env:
        PORT: "7000"
        # RULE 1 FIX, found live this session: currencyservice's
        # @google-cloud/profiler dependency ships a native pprof addon
        # that is MISSING for this build's musl/node ABI
        # (node-v137-linux-x64-musl) — the process crash-loops on require()
        # at startup unless DISABLE_PROFILER is set (checked for presence,
        # not value, matching the Python services' identical pattern).
        # This is a packaging defect in the vendored image, not a
        # configuration choice this chart is opting into.
        DISABLE_PROFILER: "1"
      securityContext:
        runAsUser: 1000
        readOnlyRootFilesystem: true
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { cpu: 200m, memory: 128Mi }
    paymentservice:
      port: 50051
      replicas: 1
      env:
        PORT: "50051"
        # RULE 1 FIX, found live this session — same broken native pprof
        # addon as currencyservice above (identical stack trace,
        # node-v137-linux-x64-musl missing pprof.node); DISABLE_PROFILER
        # avoids the crash-loop.
        DISABLE_PROFILER: "1"
      securityContext:
        runAsUser: 1000
        readOnlyRootFilesystem: true
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { cpu: 200m, memory: 128Mi }
    shippingservice:
      port: 50051
      replicas: 1
      env:
        PORT: "50051"
        # Unset, shippingservice's own default polarity enables a
        # background Stackdriver-profiler goroutine (a GCP call this
        # estate has nothing to answer with) — DISABLE_PROFILER is only
        # checked for presence, not value.
        DISABLE_PROFILER: "1"
      securityContext:
        runAsUser: 1000
        readOnlyRootFilesystem: true
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { cpu: 200m, memory: 128Mi }
    emailservice:
      port: 8080
      replicas: 1
      env:
        PORT: "8080"
        DISABLE_PROFILER: "1" # same reasoning as shippingservice above
      securityContext:
        runAsUser: 1000
        readOnlyRootFilesystem: true
      resources:
        requests: { cpu: 50m, memory: 96Mi }
        limits: { cpu: 200m, memory: 192Mi }
    recommendationservice:
      port: 8080
      replicas: 1
      env:
        PORT: "8080"
        PRODUCT_CATALOG_SERVICE_ADDR: "productcatalogservice:3550"
        DISABLE_PROFILER: "1" # same reasoning as shippingservice above
      securityContext:
        runAsUser: 1000
        readOnlyRootFilesystem: true
      resources:
        requests: { cpu: 50m, memory: 128Mi }
        limits: { cpu: 250m, memory: 256Mi }
    adservice:
      port: 9555
      replicas: 1
      env:
        PORT: "9555"
      securityContext:
        runAsUser: 1000
        readOnlyRootFilesystem: true
      resources:
        # A JVM service — the largest requests/limits of the backend set,
        # proportionate to the JVM's own baseline footprint.
        requests: { cpu: 100m, memory: 256Mi }
        limits: { cpu: 300m, memory: 384Mi }
    checkoutservice:
      port: 5050
      replicas: 1
      env:
        PORT: "5050"
        SHIPPING_SERVICE_ADDR: "shippingservice:50051"
        PRODUCT_CATALOG_SERVICE_ADDR: "productcatalogservice:3550"
        CART_SERVICE_ADDR: "cartservice:7070"
        CURRENCY_SERVICE_ADDR: "currencyservice:7000"
        EMAIL_SERVICE_ADDR: "emailservice:8080"
        PAYMENT_SERVICE_ADDR: "paymentservice:50051"
      securityContext:
        runAsUser: 1000
        readOnlyRootFilesystem: true
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { cpu: 200m, memory: 128Mi }
  # frontend: the one storefront workload with an external route (D-20)
  # and the branding surface. The rebrand itself (Plan 03-03 Task 2) is a
  # hardcoded template/asset edit inside the vendored frontend source, NOT
  # a config-driven toggle (upstream's own CYMBAL_BRANDING env var is its
  # unrelated two-way switch between ITS OWN demo identities, neither of
  # which is Athena) — so there is no branding value to project here; the
  # built athena-frontend image already serves Athena's name and logo.
  frontend:
    port: 8080
    replicas: 1
    env:
      PRODUCT_CATALOG_SERVICE_ADDR: "productcatalogservice:3550"
      CURRENCY_SERVICE_ADDR: "currencyservice:7000"
      CART_SERVICE_ADDR: "cartservice:7070"
      RECOMMENDATION_SERVICE_ADDR: "recommendationservice:8080"
      CHECKOUT_SERVICE_ADDR: "checkoutservice:5050"
      SHIPPING_SERVICE_ADDR: "shippingservice:50051"
      AD_SERVICE_ADDR: "adservice:9555"
      # shoppingassistantservice is excluded from this deploy (D-15
      # amendment, UPSTREAM.md) — never deployed, no Service exists at
      # this name. frontend's own mustMapEnv panics on an EMPTY value at
      # startup but never dials this address unless the excluded
      # /assistant or /bot route is actually invoked (never exercised by
      # this plan's live proof) — a deliberately non-resolving address,
      # not a mistake.
      SHOPPING_ASSISTANT_SERVICE_ADDR: "shoppingassistantservice.excluded.invalid:9000"
    securityContext:
      runAsUser: 1000
      readOnlyRootFilesystem: true
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 250m, memory: 128Mi }
  # loadgenerator (D-15): free continuous traffic for Phase 4's dashboards
  # and rollout analysis. Targets the in-cluster frontend Service, never
  # the external hostname (routing internal synthetic traffic back out
  # through the Gateway would distort exactly the metrics Phase 4 is about
  # to measure).
  loadgenerator:
    enabled: true
    users: 10
    spawnRate: 1
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 200m, memory: 256Mi }
