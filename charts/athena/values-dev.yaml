# values-dev.yaml — dev's overrides only (image tag, hostname, environment
# name). Everything else inherits values.yaml's shared defaults.
#
# The image tag is the immutable short-SHA of the athena-app commit this
# image was built from (D-22 — never `latest`, never retagged). Plan 03-07's
# CI takes over bumping this value on every merge to athena-app's main; this
# task sets it by hand, once, as the tracer's one deliberate manual step
# (recorded verbatim in this task's commit message alongside the exact
# `docker buildx build --push` command used).
media:
  image:
    tag: "ede5af6" # athena-app@ede5af6 (PR #12, merged) — adds S3
    # upload/fetch/list (Plan 03-05, Tasks 1-2) on top of Plan 03-04's
    # Postgres/Valkey session slice.
  hostname: media-dev.athena.net
  env:
    environment: dev
  s3:
    # Terraform's real output (envs/dev/data-storage's media_bucket_name).
    bucket: athena-media-dev
    # Dev's simulated LocalStack account id (scripts/tf-env.sh) — used as
    # BOTH the access key and secret key, matching every other Terraform
    # invocation against this environment's simulated account.
    accessKeyId: "111111111111"
    secretAccessKey: "111111111111"

shop:
  image:
    tag: "9034b09" # athena-app@9034b09 (PR #10, merged) — Plan 03-03 Task 3's
    # build-all-images.sh run; all 11 in-scope athena-<service> images
    # exist in the local registry at this tag.
  hostname: shop-dev.athena.net
