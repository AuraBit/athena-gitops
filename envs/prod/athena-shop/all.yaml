apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop
  namespace: prod
spec:
  hostnames:
  - shop-prod.athena.net
  parentRefs:
  - name: athena
    namespace: gateway
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: frontend
      port: 8080
    matches:
    - path:
        type: PathPrefix
        value: /
