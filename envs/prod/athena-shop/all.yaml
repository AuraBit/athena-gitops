apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: frontend
  name: frontend
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - env:
        - name: PORT
          value: "8080"
        - name: AD_SERVICE_ADDR
          value: adservice:9555
        - name: CART_SERVICE_ADDR
          value: cartservice:7070
        - name: CHECKOUT_SERVICE_ADDR
          value: checkoutservice:5050
        - name: CURRENCY_SERVICE_ADDR
          value: currencyservice:7000
        - name: PRODUCT_CATALOG_SERVICE_ADDR
          value: productcatalogservice:3550
        - name: RECOMMENDATION_SERVICE_ADDR
          value: recommendationservice:8080
        - name: SHIPPING_SERVICE_ADDR
          value: shippingservice:50051
        - name: SHOPPING_ASSISTANT_SERVICE_ADDR
          value: shoppingassistantservice.excluded.invalid:9000
        image: athena-registry:5000/athena-frontend:9034b09
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /_healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        name: frontend
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /_healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: 250m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
---
