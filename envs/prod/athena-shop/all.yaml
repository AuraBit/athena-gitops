apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: adservice
  name: adservice
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adservice
  template:
    metadata:
      labels:
        app: adservice
    spec:
      containers:
      - env:
        - name: PORT
          value: "9555"
        image: athena-registry:5000/athena-adservice:9034b09
        imagePullPolicy: IfNotPresent
        livenessProbe:
          grpc:
            port: 9555
          initialDelaySeconds: 10
          periodSeconds: 10
        name: adservice
        ports:
        - containerPort: 9555
          name: grpc
        readinessProbe:
          grpc:
            port: 9555
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: 300m
            memory: 384Mi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
---
