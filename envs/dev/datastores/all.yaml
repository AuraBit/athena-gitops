apiVersion: v1
kind: Secret
metadata:
  name: media-postgres-credentials
  namespace: dev
stringData:
  database-url: postgresql://media:media-postgres-dev-only@media-postgres:5432/media?sslmode=disable
  postgres-password: media-postgres-dev-only
type: Opaque
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: media-postgres
  name: media-postgres
  namespace: dev
spec:
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
  selector:
    app: media-postgres
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: media-valkey
  name: media-valkey
  namespace: dev
spec:
  ports:
  - name: valkey
    port: 6379
    targetPort: valkey
  selector:
    app: media-valkey
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: redis-cart
  name: redis-cart
  namespace: dev
spec:
  ports:
  - name: valkey
    port: 6379
    targetPort: valkey
  selector:
    app: redis-cart
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-postgres-data
  namespace: dev
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: media-postgres
  name: media-postgres
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: media-postgres
    spec:
      containers:
      - env:
        - name: POSTGRES_USER
          value: media
        - name: POSTGRES_DB
          value: media
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: postgres-password
              name: media-postgres-credentials
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        image: postgres:18
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - media
          initialDelaySeconds: 10
          periodSeconds: 10
        name: postgres
        ports:
        - containerPort: 5432
          name: postgres
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - media
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: data
      securityContext:
        fsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: media-postgres-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: media-valkey
  name: media-valkey
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-valkey
  template:
    metadata:
      labels:
        app: media-valkey
    spec:
      containers:
      - image: valkey/valkey:8
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - valkey-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 10
        name: valkey
        ports:
        - containerPort: 6379
          name: valkey
        readinessProbe:
          exec:
            command:
            - valkey-cli
            - ping
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: redis-cart
  name: redis-cart
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-cart
  template:
    metadata:
      labels:
        app: redis-cart
    spec:
      containers:
      - image: valkey/valkey:8
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - valkey-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 10
        name: valkey
        ports:
        - containerPort: 6379
          name: valkey
        readinessProbe:
          exec:
            command:
            - valkey-cli
            - ping
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
